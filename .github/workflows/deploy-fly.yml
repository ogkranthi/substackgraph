name: Deploy to Fly.io

# Continuous deployment: every push to the default/dev branch ships to production.
# One-time setup (see docs/DEPLOY.md): create the Fly app + volume, then add the
# repository secret FLY_API_TOKEN. Until that secret exists, this workflow no-ops
# cleanly instead of failing — so the repo stays green before go-live.

on:
  push:
    branches: ["main", "claude/modest-johnson-NnY2U"]
  workflow_dispatch:
    inputs:
      target:
        description: "Which app to deploy"
        type: choice
        default: auto
        options: [auto, staging, production]

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for deploy token
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set — skipping deploy (one-time setup not done yet)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select target (manual input wins, else production on main / staging on dev)
        if: steps.guard.outputs.skip == 'false'
        id: target
        env:
          CHOICE: ${{ github.event.inputs.target }}
        run: |
          # Resolve "auto" to production on main, staging elsewhere.
          want="$CHOICE"
          if [ -z "$want" ] || [ "$want" = "auto" ]; then
            if [ "${{ github.ref_name }}" = "main" ]; then want="production"; else want="staging"; fi
          fi
          if [ "$want" = "production" ]; then
            echo "config=fly.toml" >> "$GITHUB_OUTPUT"
            echo "app=substackgraph-jm6dyg" >> "$GITHUB_OUTPUT"
            echo "name=production" >> "$GITHUB_OUTPUT"
          else
            echo "config=fly.staging.toml" >> "$GITHUB_OUTPUT"
            echo "app=substackgraph-staging" >> "$GITHUB_OUTPUT"
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test the image before deploying (mimics Fly's root-owned volume)
        if: steps.guard.outputs.skip == 'false'
        run: |
          docker build -t sg:deploycheck .
          docker volume create sgdeploy
          docker run -d --name sgdeploy -p 8000:8000 \
            -e LOAD_DEMO_ON_START=1 -e ALLOW_LIVE_CRAWL=0 \
            -v sgdeploy:/data sg:deploycheck
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/body.html -w '%{http_code}' http://127.0.0.1:8000/ || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          ok=1
          [ "$code" = "200" ] || ok=0
          grep -q "canonical publications" /tmp/body.html || ok=0
          if [ "$ok" != "1" ]; then
            echo "::error::Pre-deploy smoke test failed (GET / -> $code); refusing to deploy."
            docker logs sgdeploy || true
            docker rm -f sgdeploy || true
            exit 1
          fi
          docker rm -f sgdeploy || true
          echo "Pre-deploy smoke test passed."

      - name: Set up flyctl
        if: steps.guard.outputs.skip == 'false'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Bootstrap app + cache volume (idempotent, first run only)
        if: steps.guard.outputs.skip == 'false'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.target.outputs.app }}
          REGION: ${{ vars.FLY_REGION || 'iad' }}
          ORG: ${{ vars.FLY_ORG || 'personal' }}
        run: |
          # Create the app if it doesn't exist yet (so no manual flyctl needed).
          if ! flyctl apps list | awk '{print $1}' | grep -qx "$APP"; then
            flyctl apps create "$APP" --org "$ORG"
          fi
          # Ensure exactly one persistent cache volume named "data" exists.
          if ! flyctl volumes list -a "$APP" 2>/dev/null | grep -qw data; then
            flyctl volumes create data -a "$APP" --region "$REGION" --size 1 --yes
          fi

      - name: Deploy ${{ steps.target.outputs.name }}
        if: steps.guard.outputs.skip == 'false'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config ${{ steps.target.outputs.config }}
